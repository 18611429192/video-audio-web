<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="完全在浏览器本地运行的视频音频分离与 MP3 转换工具" />
    <title>视频音频分离 · 本地 MP3 转换</title>
    <link rel="stylesheet" href="./src/style.css" />
    <script type="importmap">
      {
        "imports": {
          "@ffmpeg/ffmpeg": "https://esm.sh/@ffmpeg/ffmpeg@0.12.15?bundle",
          "@ffmpeg/util": "https://esm.sh/@ffmpeg/util@0.12.2?bundle"
        }
      }
    </script>
    <style>
      html,body{margin:0;min-height:100%;background:#0b1020;color:#eef2ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      #boot{max-width:760px;margin:12vh auto;padding:28px;border:1px solid #26304d;border-radius:18px;background:#121a2c;line-height:1.7}
      #boot h1{margin:0 0 10px;font-size:28px} #boot p{margin:6px 0;color:#c7d2fe}
      #boot .err{margin-top:16px;padding:12px;border-radius:12px;background:#26151b;color:#fecdd3;white-space:pre-wrap;word-break:break-word}
    </style>
  </head>
  <body>
    <main id="app">
      <div id="boot">
        <h1>视频 → MP3</h1>
        <p>正在加载网页程序…</p>
        <p>如果这里长时间不消失，页面脚本没有正确加载。</p>
      </div>
    </main>
    <script>
      window.__APP_BUILD = '20260820-1701';
      window.__showBootError = function (message) {
        var boot = document.getElementById('boot');
        if (!boot) return;
        var box = document.createElement('div');
        box.className = 'err';
        box.textContent = '页面脚本加载失败：\n' + message;
        boot.appendChild(box);
      };
      window.addEventListener('error', function (event) {
        if (event && event.message) window.__showBootError(event.message);
      });
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        window.__showBootError(reason && reason.message ? reason.message : String(reason));
      });
      setTimeout(function () {
        if (document.getElementById('boot')) {
          window.__showBootError('主程序 8 秒内没有启动。');
        }
      }, 8000);

      // 无论 Pages 最终发布的是 Vite 构建产物还是仓库源码，
      // FFmpeg core 在 Cache Storage 未命中时统一从 CDN 获取。
      (function () {
        var nativeFetch = window.fetch.bind(window);
        var cdnBase = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm/';
        window.fetch = function (input, init) {
          var rawUrl = typeof input === 'string' ? input : (input && input.url ? input.url : String(input));
          try {
            var parsed = new URL(rawUrl, window.location.href);
            if (parsed.origin === window.location.origin) {
              var match = parsed.pathname.match(/\/ffmpeg-core\/(ffmpeg-core\.(?:js|wasm))$/);
              if (match) return nativeFetch(cdnBase + match[1], init);
            }
          } catch (_) {}
          return nativeFetch(input, init);
        };
      })();

      // 当前 @ffmpeg/core 在部分手机浏览器执行 ffprobe 会直接 Aborted()。
      // 一旦发生 abort，后续 FFmpeg exec 也可能无法继续。因此这里不让 FFPROBE
      // 真正进入 WASM，而是返回非零码，让主程序直接走 FFmpeg 日志兼容分析。
      // 同时把旧的“只有输入没有输出”的日志探测命令补成合法 null 输出。
      (function () {
        var NativeWorker = window.Worker;
        if (!NativeWorker || typeof Proxy === 'undefined') return;
        var localFFmpegWorker = new URL('./src/ffmpeg-class-worker.js', window.location.href).href;
        window.Worker = new Proxy(NativeWorker, {
          construct: function (Target, args) {
            var url = args[0];
            var options = args[1];
            try {
              var parsed = new URL(String(url), window.location.href);
              var isFFmpegCDNWorker = parsed.origin !== window.location.origin &&
                parsed.hostname === 'esm.sh' &&
                parsed.pathname.indexOf('/@ffmpeg/ffmpeg@0.12.15/') !== -1 &&
                /\/worker\.js$/.test(parsed.pathname);
              if (isFFmpegCDNWorker) url = localFFmpegWorker;
            } catch (_) {}

            var worker = Reflect.construct(Target, [url, options]);
            var nativePostMessage = worker.postMessage.bind(worker);
            worker.postMessage = function (message, transfer) {
              try {
                if (message && message.type === 'FFPROBE') {
                  var reply = {
                    data: {
                      id: message.id,
                      type: 'FFPROBE',
                      data: 1
                    }
                  };
                  setTimeout(function () {
                    if (typeof worker.onmessage === 'function') worker.onmessage(reply);
                  }, 0);
                  return;
                }

                var probeArgs = message && message.type === 'EXEC' && message.data && message.data.args;
                if (Array.isArray(probeArgs) && probeArgs.length === 3 && probeArgs[0] === '-hide_banner' && probeArgs[1] === '-i') {
                  message = Object.assign({}, message, {
                    data: Object.assign({}, message.data, {
                      args: probeArgs.concat(['-map', '0:a?', '-c', 'copy', '-frames:a', '1', '-f', 'null', '-'])
                    })
                  });
                }
              } catch (_) {}
              return transfer === undefined ? nativePostMessage(message) : nativePostMessage(message, transfer);
            };
            return worker;
          }
        });
      })();
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="完全在浏览器本地运行的视频音频分离与 MP3 转换工具" />
    <title>视频音频分离 · 本地 MP3 转换</title>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const base = new URL('./', window.location.href);
          navigator.serviceWorker.register(new URL('sw.js', base), { scope: base.pathname })
            .catch((error) => console.warn('Service Worker 注册失败', error));
        });
      }
    </script>
  </body>
</html>

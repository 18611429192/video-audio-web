name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Verify FFmpeg core assets
        run: |
          test -f node_modules/@ffmpeg/core/dist/esm/ffmpeg-core.js
          test -f node_modules/@ffmpeg/core/dist/esm/ffmpeg-core.wasm
          ls -lh node_modules/@ffmpeg/core/dist/esm/ffmpeg-core.*

      - name: Build site
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/ffmpeg-core/ffmpeg-core.js
          test -f dist/ffmpeg-core/ffmpeg-core.wasm
          find dist -maxdepth 2 -type f -printf '%p %k KB\n' | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

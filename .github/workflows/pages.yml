name: Build and Deploy Single HTML

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Verify embedded FFmpeg source assets
        run: |
          test -f node_modules/@ffmpeg/core/dist/umd/ffmpeg-core.js
          test -f node_modules/@ffmpeg/core/dist/umd/ffmpeg-core.wasm
          ls -lh node_modules/@ffmpeg/core/dist/umd/ffmpeg-core.*

      - name: Test 20-tool application
        run: npm run test:tools

      - name: Test audio track parser
        run: node scripts/test-track-parser.mjs

      - name: Build standalone HTML
        run: npm run build

      - name: Verify single-file output
        run: |
          test -f dist/index.html
          test "$(find dist -type f | wc -l)" -eq 1
          test "$(stat -c%s dist/index.html)" -gt 30000000
          grep -q 'id="ffmpeg-core-wasm-b64"' dist/index.html
          grep -q '__INLINE_FFMPEG_CORE_DIRECT__' dist/index.html
          grep -q 'id="input-track-parser-fix"' dist/index.html
          grep -q '音视频工具箱' dist/index.html
          grep -q '20 个工具' dist/index.html
          ! grep -q 'id="ffmpeg-core-js-b64"' dist/index.html
          ! grep -q 'importScripts(coreURL)' dist/index.html
          ! grep -q 'fetch(wasmURL)' dist/index.html
          echo "Standalone file:"
          ls -lh dist/index.html

      - name: Upload offline HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-audio-offline-single-html
          path: dist/index.html
          retention-days: 90

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
